<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guess the Severity Widget</title>
<script src="https://cdn.plot.ly/plotly-2.34.0.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #1f1f1f 0%, #2a2a2a 100%);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: rgba(42, 42, 42, 0.8);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #FF1493, #FF69B4, #FF8C00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .info-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 30px;
  }

  .slider-card {
    background: linear-gradient(135deg, rgba(255, 105, 180, 0.1), rgba(255, 140, 0, 0.1));
    border: 1px solid rgba(255, 200, 100, 0.3);
    border-radius: 10px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .slider-card label {
    font-weight: 600;
    font-size: 12px;
    color: #888888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .slider-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .slider-container input[type="range"] {
    flex: 1;
    padding: 6px 0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 14px;
    transition: all 200ms ease;
    accent-color: #FF69B4;
    height: 6px;
    cursor: pointer;
  }

  .slider-container input[type="range"]:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .slider-container input[type="range"]:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-color: #FF69B4;
  }

  #sliderValue {
    min-width: 45px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    color: #FF69B4;
  }

  .info-card {
    background: linear-gradient(135deg, rgba(255, 105, 180, 0.1), rgba(255, 140, 0, 0.1));
    border: 1px solid rgba(255, 200, 100, 0.3);
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .info-card-label {
    font-size: 12px;
    color: #888888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .info-card-value {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
  }

  .visualization-container {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
  }

  #plot {
    width: 100%;
    height: 300px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
  }

  .guess-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .guess-group label {
    font-weight: 600;
    font-size: 14px;
    color: #b0b0b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  select {
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 14px;
    transition: all 200ms ease;
    cursor: pointer;
  }

  select:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
  }

  select:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-color: #FF69B4;
  }

  button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 200ms ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 100%;
  }

  #revealBtn {
    background: linear-gradient(135deg, #FF1493, #FF69B4);
    color: white;
    box-shadow: 0 8px 24px rgba(255, 105, 180, 0.3);
  }

  #revealBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255, 105, 180, 0.5);
  }

  #revealBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #resetBtn {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  #resetBtn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .result-box {
    background: rgba(255, 255, 255, 0.02);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    display: none;
    animation: slideIn 300ms ease;
  }

  .result-box.show {
    display: block;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .result-correct {
    border-color: #00CC96;
    background: rgba(0, 204, 150, 0.1);
  }

  .result-incorrect {
    border-color: #FF6692;
    background: rgba(255, 102, 146, 0.1);
  }

  .result-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .result-text {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .result-details {
    font-size: 14px;
    color: #aaaaaa;
    margin-top: 12px;
  }

  .severity-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 600;
    margin: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔬 Guess the Severity</h1>

  <!-- Patient Info Panel with Slider in First Column -->
  <div class="info-panel">
    <!-- Slider Card (first column) -->
    <div class="slider-card">
      <label>Select Patient</label>
      <div class="slider-container">
        <input type="range" id="patientSlider" min="0" max="13" value="0" />
        <span id="sliderValue">1/14</span>
      </div>
    </div>

    <!-- Info Cards -->
    <div class="info-card">
      <div class="info-card-label">Sex</div>
      <div class="info-card-value" id="infoSex">-</div>
    </div>
    <div class="info-card">
      <div class="info-card-label">Age</div>
      <div class="info-card-value" id="infoAge">-</div>
    </div>
    <div class="info-card">
      <div class="info-card-label">Smoker</div>
      <div class="info-card-value" id="infoSmoker">-</div>
    </div>
  </div>

  <!-- Cell Distribution Plot -->
  <div class="visualization-container">
    <div id="plot"></div>
  </div>

  <!-- Controls Grid -->
  <div class="controls-grid">
    <!-- Column 1: Guess Dropdown -->
    <div class="guess-group">
      <label>What is the severity?</label>
      <select id="severityGuess">
        <option value="Healthy">Healthy</option>
        <option value="Asymptomatic">Asymptomatic</option>
        <option value="Mild">Mild</option>
        <option value="Moderate">Moderate</option>
        <option value="Severe">Severe</option>
        <option value="Critical">Critical</option>
        <option value="Non-covid">Non-covid</option>
      </select>
    </div>

    <!-- Column 2: Reveal Button -->
    <button id="revealBtn">Reveal Answer</button>

    <!-- Column 3: Reset Button -->
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Result Box -->
  <div class="result-box" id="resultBox">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-text" id="resultText"></div>
    <div class="result-details">
      Your guess: <span class="severity-badge" id="guessDisplay"></span><br>
      Correct answer: <span class="severity-badge" id="answerDisplay"></span>
    </div>
  </div>
</div>

<script>
const severityColors = {
  'Healthy': '#00CC96',
  'Asymptomatic': '#AB63FA',
  'Mild': '#FFA15A',
  'Moderate': '#19D3F3',
  'Severe': '#FF6692',
  'Critical': '#EF553B',
  'Non-covid': '#636EFA'
};

// Plotly creative light color palette
const creativeColors = [
  '#636EFA',
  '#EF553B',
  '#00CC96',
  '#AB63FA',
  '#FFA15A',
  '#19D3F3',
  '#FF6692',
  '#B6E880',
  '#FF97FF',
  '#FECB52'
];

const patientData = [];

async function init() {
  try {
    const response = await fetch('widget_patients_data.json');
    if (!response.ok) throw new Error('Failed to load patient data');
    const data = await response.json();
    patientData.push(...data);

    document.getElementById('patientSlider').max = patientData.length - 1;
    displayPatient(0);
  } catch (error) {
    console.error('Error loading data:', error);
    createMockData();
  }
}

function createMockData() {
  const severities = ['Healthy', 'Asymptomatic', 'Mild', 'Moderate', 'Severe', 'Critical', 'Non-covid'];
  const cellTypes = ['CD4', 'CD8', 'NK', 'Mono', 'B', 'Treg', 'Th17', 'Platelets', 'DCs'];

  severities.forEach(severity => {
    for (let i = 0; i < 2; i++) {
      const patient = {
        patient_id: 'PAT_' + severity + '_' + (i + 1),
        severity: severity,
        sex: Math.random() > 0.5 ? 'M' : 'F',
        age_interval: ['18-30', '30-50', '50-70', '70+'][Math.floor(Math.random() * 4)],
        smoker: Math.random() > 0.5 ? 'Yes' : 'No',
        total_cells: Math.floor(Math.random() * 10000) + 5000
      };

      let remaining = 100;
      cellTypes.forEach((ct, idx) => {
        if (idx === cellTypes.length - 1) {
          patient[ct] = remaining;
        } else {
          const proportion = Math.random() * remaining * 0.3;
          patient[ct] = Math.round(proportion * 10) / 10;
          remaining -= patient[ct];
        }
      });

      patientData.push(patient);
    }
  });

  document.getElementById('patientSlider').max = patientData.length - 1;
  displayPatient(0);
}

function displayPatient(index) {
  const patient = patientData[index];

  document.getElementById('infoSex').textContent = patient.sex;
  document.getElementById('infoAge').textContent = patient.age_interval;
  document.getElementById('infoSmoker').textContent = patient.smoker;

  document.getElementById('patientSlider').value = index;
  document.getElementById('sliderValue').textContent = (index + 1) + '/' + patientData.length;

  document.getElementById('resultBox').classList.remove('show');

  createStackedBarPlot(patient);
}

function createStackedBarPlot(patient) {
  const cellTypes = Object.keys(patient).filter(k => 
    !['patient_id', 'severity', 'sex', 'age_interval', 'smoker', 'total_cells'].includes(k)
  );

  const cellData = cellTypes.map(ct => ({
    name: ct,
    proportion: patient[ct],
    color: severityColors[patient.severity] || '#999999'
  })).sort((a, b) => b.proportion - a.proportion);

  const traces = [];

  cellData.forEach((cell, idx) => {
    traces.push({
      x: [cell.proportion],
      y: ['Cell Distribution'],
      name: cell.name,
      type: 'bar',
      orientation: 'h',
      marker: {color: creativeColors[idx % creativeColors.length]},
      text: cell.name + ': ' + cell.proportion.toFixed(1) + '%',
      textposition: 'inside',
      textfont: {color: 'white', size: 10},
      hovertemplate: '<b>' + cell.name + '</b><br>Proportion: %{x:.1f}%<extra></extra>',
      showlegend: true
    });
  });

  const layout = {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(255,255,255,0.02)',
    barmode: 'stack',
    xaxis: {
      title: 'Cell Type Proportion (%)',
      titlefont: {color: '#888888', size: 12},
      tickfont: {color: '#888888'},
      gridcolor: 'rgba(255,255,255,0.1)',
      range: [0, 100]
    },
    yaxis: {
      tickfont: {color: '#888888'},
      showgrid: false
    },
    margin: {l: 100, r: 50, t: 20, b: 40},
    legend: {
      orientation: 'v',
      x: 1.02,
      y: 1,
      bgcolor: 'rgba(0,0,0,0.3)',
      bordercolor: 'rgba(255,255,255,0.2)',
      borderwidth: 1,
      font: {color: '#ffffff', size: 10}
    },
    font: {family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif'},
    hovermode: 'closest'
  };

  Plotly.newPlot('plot', traces, layout, {displayModeBar: false, responsive: true});
}

document.getElementById('revealBtn').addEventListener('click', function() {
  const currentIndex = parseInt(document.getElementById('patientSlider').value);
  const patient = patientData[currentIndex];
  const guess = document.getElementById('severityGuess').value;
  const isCorrect = guess === patient.severity;

  const resultBox = document.getElementById('resultBox');
  const guessDisplay = document.getElementById('guessDisplay');
  const answerDisplay = document.getElementById('answerDisplay');

  guessDisplay.textContent = guess;
  guessDisplay.style.backgroundColor = severityColors[guess];
  guessDisplay.style.color = '#ffffff';

  answerDisplay.textContent = patient.severity;
  answerDisplay.style.backgroundColor = severityColors[patient.severity];
  answerDisplay.style.color = '#ffffff';

  if (isCorrect) {
    resultBox.classList.remove('result-incorrect');
    resultBox.classList.add('result-correct');
    document.getElementById('resultIcon').textContent = '✓';
    document.getElementById('resultText').textContent = 'Correct!';
  } else {
    resultBox.classList.remove('result-correct');
    resultBox.classList.add('result-incorrect');
    document.getElementById('resultIcon').textContent = '✗';
    document.getElementById('resultText').textContent = 'Incorrect';
  }

  resultBox.classList.add('show');
});

document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('severityGuess').value = 'Healthy';
});

document.getElementById('patientSlider').addEventListener('input', function(e) {
  displayPatient(parseInt(e.target.value));
});

window.addEventListener('load', init);
</script>
</body>
</html>
